name: Continuous Integration & Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ------------------------------------------------------------------ #
  # Job 1: Backend Pipeline (Java 21, Maven, JaCoCo, JUnit)            #
  # ------------------------------------------------------------------ #
  backend:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Automated Unit and Integration Tests
        run: mvn clean verify -B

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload Backend Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-artifact
          path: target/*.jar
          retention-days: 7

  # ------------------------------------------------------------------ #
  # Job 2: Frontend Pipeline (Node 20, Vitest, Vite Build)             #
  # ------------------------------------------------------------------ #
  frontend:
    name: Frontend Build & Test (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package*.json'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Vitest Unit & Component Tests
        run: npm test

      - name: Build Production React SPA Asset Bundle
        run: npm run build

      - name: Upload Frontend Dist Production Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-artifact
          path: ./frontend/dist/
          retention-days: 7

  # ------------------------------------------------------------------ #
  # Job 3: Docker Container & Compose Validation                       #
  # ------------------------------------------------------------------ #
  docker-validation:
    name: Docker Images & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false

      - name: Validate Frontend Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

      - name: Validate Docker Compose Configuration
        run: docker compose config
