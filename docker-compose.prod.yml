version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fraud-risk-postgres
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - risk-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-risk-backend-prod
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/fraud_db
      - SPRING_DATASOURCE_USERNAME=fraud_user
      - SPRING_DATASOURCE_PASSWORD=fraud_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - risk-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraud-risk-frontend-prod
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - risk-network

volumes:
  postgres-data:
    driver: local

networks:
  risk-network:
    driver: bridge
